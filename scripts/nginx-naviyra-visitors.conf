# Extra nginx access log with $host for Naviyra Security visitors.
# Included from http {} via conf.d. Servers that set their own access_log
# must also log to this file (the agent injects that).
log_format naviyra_visitors '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';
access_log /var/log/nginx/naviyra-visitors.log naviyra_visitors;
