# Custom Naviyra HTTP error pages (shared across hosted sites)
# Pages live in /var/www/naviyra-errors/{code}.html

error_page 400 /__naviyra_errors/400.html;
error_page 401 /__naviyra_errors/401.html;
error_page 403 /__naviyra_errors/403.html;
error_page 404 /__naviyra_errors/404.html;
error_page 405 /__naviyra_errors/405.html;
error_page 408 /__naviyra_errors/408.html;
error_page 413 /__naviyra_errors/413.html;
error_page 429 /__naviyra_errors/429.html;
error_page 500 /__naviyra_errors/500.html;
error_page 502 /__naviyra_errors/502.html;
error_page 503 /__naviyra_errors/503.html;
error_page 504 /__naviyra_errors/504.html;

location ^~ /__naviyra_errors/ {
    alias /var/www/naviyra-errors/;
    internal;
    default_type text/html;
}
