server {
    listen 80;
    listen [::]:80;
    server_name kongunattugounder.com www.kongunattugounder.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kongunattugounder.com www.kongunattugounder.com;

    ssl_certificate     /etc/letsencrypt/live/kongunattugounder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongunattugounder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kongunattugounder.com/public_html;
    index index.php index.html index.htm;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }
}
