# Naviyra — nginx equivalent of a locked-down Apache .htaccess
# Installed as: /etc/nginx/snippets/naviyra-deny-sensitive.conf
# (.htaccess files themselves are NOT executed by nginx.)

# Hidden files/dirs except ACME challenges
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# .htaccess / .htpasswd
location ~* /(^|/)\.ht {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# /env and /.env*
location ~* ^/(env|\.env)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* ^/(env|\.env)[./_-] {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* /(^|/)(\.env|env)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* /(^|/)(\.env|env)\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# VCS
location ~* /(^|/)\.(git|svn|hg|bzr)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Dependency / lock / deploy manifests
location ~* /(^|/)(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Gemfile(\.lock)?|\.npmrc|\.yarnrc)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* /(^|/)(docker-compose\.ya?ml|Dockerfile|\.dockerignore|Procfile|\.travis\.yml|\.github|\.gitlab-ci\.yml)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# IDE / OS junk
location ~* /(^|/)(\.vscode|\.idea|\.DS_Store|Thumbs\.db|desktop\.ini)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Backups, dumps, keys
location ~* \.(bak|backup|old|orig|save|swp|swo|sql|sqlite|db|dump|pem|key|p12|pfx|log)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* /(^|/)(id_rsa|id_dsa|id_ed25519|\.ssh|credentials|\.aws|auth\.json)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# PHP / app secrets & debug endpoints
location ~* /(^|/)(phpinfo\.php|info\.php|test\.php|wp-config\.php|wp-config\.php~|web\.config|appsettings\.json|configuration\.php|settings\.php|config\.inc\.php)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* /(^|/)wp-config\.php\.(bak|old|save|txt)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* ^/(telescope|actuator|phpmyadmin|pma|adminer)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# No PHP execution under common upload folders
location ~* ^/(uploads|upload|files|media|tmp|temp|cache)/.*\.(php|phtml|php5|phar|cgi|pl|py|asp|aspx|jsp)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}
